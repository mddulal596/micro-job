<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro Job - Test Credit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f7f5ff;
      color: #222;
    }

    .card {
      max-width: 470px;
      margin: 25px auto;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(80, 50, 150, .1);
    }

    h2 {
      margin-top: 0;
      color: #673ab7;
    }

    h3 {
      margin-bottom: 8px;
      color: #555;
    }

    button, input {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #673ab7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .google {
      background: white;
      color: #333;
      border: 1px solid #ddd;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    .danger {
      background: #b3261e;
    }

    .note {
      padding: 12px;
      background: #fff4db;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    pre {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Micro Job</h2>
    <h3>Test Deposit Credit</h3>

    <div class="note">
      ⚠️ এটি শুধুমাত্র TESTING MODE-এর জন্য।
      এখানে কোনো বাস্তব টাকা জমা হয় না।
      Test Balance আসল Wallet-এর Balance নয়।
    </div>

    <button id="loginBtn" class="google">
      🔐 Google Admin Login
    </button>

    <button id="logoutBtn"
            class="secondary"
            disabled>
      Logout
    </button>

    <h3>Admin Verification</h3>

    <button id="checkBtn" disabled>
      Check Admin & Database
    </button>

    <h3>Deposit ID</h3>

    <input
      id="depositId"
      type="text"
      placeholder="Approved TEST Deposit ID"
      autocomplete="off"
      spellcheck="false">

    <button id="creditBtn"
            class="danger"
            disabled>
      Credit Test Deposit
    </button>

    <h3>Test Result</h3>

    <pre id="result">Admin Login করুন।</pre>
  </div>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      firebaseConfig
    } from "./firebase-config.js";

    const API =
      "https://microjob-test-credit-api.mddulalhosen6.workers.dev";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const checkBtn =
      document.getElementById("checkBtn");

    const creditBtn =
      document.getElementById("creditBtn");

    const depositIdInput =
      document.getElementById("depositId");

    const result =
      document.getElementById("result");

    let adminVerified = false;
    let busy = false;

    function show(data) {
      result.textContent =
        typeof data === "string"
          ? data
          : JSON.stringify(data, null, 2);
    }

    function updateButtons() {
      const signedIn = Boolean(auth.currentUser);

      loginBtn.disabled = busy;
      logoutBtn.disabled = busy || !signedIn;
      checkBtn.disabled = busy || !signedIn;

      creditBtn.disabled =
        busy || !signedIn || !adminVerified;
    }

    onAuthStateChanged(auth, user => {
      adminVerified = false;

      show(
        user
          ? "Login হয়েছে। Check Admin & Database চাপুন।"
          : "Admin Login করুন।"
      );

      updateButtons();
    });

    loginBtn.addEventListener("click", async () => {
      busy = true;
      updateButtons();

      try {
        show("Google Login হচ্ছে...");

        await signInWithPopup(auth, provider);

        show(
          "Login সফল। এখন Check Admin & Database চাপুন।"
        );

      } catch (error) {
        if (
          error.code === "auth/popup-blocked" ||
          error.code ===
            "auth/operation-not-supported-in-this-environment"
        ) {
          await signInWithRedirect(auth, provider);
          return;
        }

        show({
          success: false,
          message: "Google Login failed",
          code: error.code || "unknown"
        });

      } finally {
        busy = false;
        updateButtons();
      }
    });

    getRedirectResult(auth).catch(error => {
      show({
        success: false,
        message: "Redirect Login failed",
        code: error.code || "unknown"
      });
    });

    async function apiRequest(path, method, body) {
      const user = auth.currentUser;

      if (!user) {
        throw new Error("Login required");
      }

      const token = await user.getIdToken(true);

      const options = {
        method,
        headers: {
          Authorization: `Bearer ${token}`
        }
      };

      if (body !== undefined) {
        options.headers["Content-Type"] =
          "application/json";

        options.body = JSON.stringify(body);
      }

      const response = await fetch(
        API + path,
        options
      );

      const data = await response.json();

      return {
        httpStatus: response.status,
        ...data
      };
    }

    checkBtn.addEventListener("click", async () => {
      busy = true;
      adminVerified = false;
      updateButtons();

      try {
        show("Admin যাচাই হচ্ছে...");

        const data = await apiRequest(
          "/admin/db-test",
          "GET"
        );

        adminVerified =
          data.httpStatus === 200 &&
          data.success === true &&
          data.databaseConnected === true &&
          data.testCreditTriggerReady === true;

        show(data);

      } catch {
        show({
          success: false,
          message: "Admin verification failed"
        });

      } finally {
        busy = false;
        updateButtons();
      }
    });

    creditBtn.addEventListener("click", async () => {
      if (!adminVerified) {
        show("আগে Admin Verification করুন।");
        return;
      }

      const depositId =
        depositIdInput.value.trim();

      const validId =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
          .test(depositId);

      if (!validId) {
        show("সঠিক Deposit ID লিখুন।");
        return;
      }

      const confirmed = confirm(
        "এই অনুমোদিত TEST Deposit-এর জন্য " +
        "শুধু simulated balance credit করবেন?"
      );

      if (!confirmed) {
        return;
      }

      busy = true;
      updateButtons();

      try {
        show("Test Credit চলছে...");

        const data = await apiRequest(
          "/admin/deposits/test-credit",
          "POST",
          { depositId }
        );

        show(data);

      } catch {
        show({
          success: false,
          message: "Test Credit request failed"
        });

      } finally {
        busy = false;
        updateButtons();
      }
    });

    logoutBtn.addEventListener("click", async () => {
      busy = true;
      updateButtons();

      try {
        await signOut(auth);
        adminVerified = false;
        depositIdInput.value = "";
        show("Logout হয়েছে।");

      } finally {
        busy = false;
        updateButtons();
      }
    });
  </script>

</body>
</html>
