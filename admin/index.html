<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Job Admin</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Micro Job Admin</h1>
        <p>Admin claim required</p>
      </div>

      <div class="topbar-actions">
        <a class="link-btn" href="../">Back to Site</a>
        <button id="adminLogoutBtn" class="btn secondary hidden" type="button">Logout</button>
      </div>
    </header>

    <section id="adminAuthBox" class="card">
      <h2>Admin Login</h2>
      <p class="muted">শুধু admin custom claim থাকা account access করতে পারবে।</p>

      <form id="adminLoginForm" class="form">
        <div class="field">
          <label for="adminEmail">Email</label>
          <input id="adminEmail" type="email" placeholder="Admin email" required />
        </div>
        <div class="field">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" type="password" placeholder="Password" required />
        </div>
        <button class="btn primary" type="submit">Login as Admin</button>
      </form>
    </section>

    <section id="adminDeniedBox" class="card hidden">
      <h2>Access Denied</h2>
      <p class="muted">আপনার account এ admin claim নেই।</p>
    </section>

    <section id="adminApp" class="hidden">
      <div id="adminMessage" class="message hidden"></div>

      <div id="adminStats" class="stats-grid"></div>

      <div class="grid-2">
        <div class="card">
          <h3>Pending Jobs</h3>
          <div id="pendingJobsList" class="list"></div>
        </div>

        <div class="card">
          <h3>Pending Tasks</h3>
          <div id="pendingTasksList" class="list"></div>
        </div>
      </div>

      <div class="grid-2 mt">
        <div class="card">
          <h3>Pending Deposits</h3>
          <div id="pendingDepositsList" class="list"></div>
        </div>

        <div class="card">
          <h3>Pending Withdrawals</h3>
          <div id="pendingWithdrawalsList" class="list"></div>
        </div>
      </div>

      <div class="card mt">
        <h3>Users</h3>
        <div id="usersList" class="list"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
